# CPU:   docker compose --profile cpu  up --build
# ROCm:  docker compose --profile rocm up --build
x-common: &common
  ports: ["8000:8000"]
  volumes: ["./models:/models"]
  restart: unless-stopped
  environment:
    DEVICE: auto
    # DEFAULT_BACKEND: plantnet300k
    # BIOCLIP_MODEL: hf-hub:imageomics/bioclip-2
    # PLANTNET_ALLOW_PICKLE: "1"   # only for the official, trusted checkpoint if safe loading fails
    # ENABLE_MOCK: "1"             # placeholder model for UI testing

services:
  plant-id:
    <<: *common
    profiles: ["cpu"]
    build: { context: ., dockerfile: Dockerfile }

  plant-id-rocm:
    <<: *common
    profiles: ["rocm"]
    build: { context: ., dockerfile: Dockerfile.rocm }
    devices: ["/dev/kfd:/dev/kfd", "/dev/dri:/dev/dri"]
    group_add: ["video", "render"]
    security_opt: ["seccomp=unconfined"]
    # environment additions if the GPU is not picked up (see README):
    #   HSA_OVERRIDE_GFX_VERSION: "11.0.0"
